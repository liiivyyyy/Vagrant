upstream backend_olivia {
    # Round-robin por defecto
    server nodo1.olivia.local:80;
    server nodo2.olivia.local:80;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://backend_olivia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
